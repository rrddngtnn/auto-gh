[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-gh"
version = "0.1.0"
description = "GitHub identity lifecycle manager, 20k sticky residential proxy allocator, mailbox OTP poller, and Camoufox profile runner."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
auto-gh = "auto_gh.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
